# yaml-language-server: $schema=./schema/shop.schema.json
# Vendor stock. The trader NPC (see npcs.yaml) sells exactly this list.
#
# Each entry has a cost in gold and a display name. Some entries have stat fields
# (damageBonus, armorBonus, heal) that the engine wires into character equipment
# or item effects.

weapon:
  cost: 90
  knightName: Iron Sabre
  casterName: Amber Wand
  damageBonus: 7

armor:
  cost: 75
  name: Padded Mail
  armorBonus: 4

axe:
  cost: 25
  name: Bronze Axe

fishing_rod:
  cost: 18
  name: Fishing Rod

pickaxe:
  cost: 25
  name: Bronze Pickaxe

hunting_bow:
  cost: 35
  name: Hunting Bow

flint_steel:
  cost: 16
  name: Flint and Steel

potion:
  cost: 12
  name: Health Potion
  heal: 58

# Alchemist stock (sold by the alchemist NPC, see npcs.yaml).
empty_flask:
  cost: 6
  name: Empty Flask

alchemy_kit:
  cost: 40
  name: Alchemy Kit

broken_reach_map:
  cost: 150
  name: Inked Survey of The Broken Reach
