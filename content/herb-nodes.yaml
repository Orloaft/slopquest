# yaml-language-server: $schema=./schema/herb-nodes.schema.json
# Wild herb patches a player can gather from (timed, no tool required).
#
# at        — the herb tile coordinates.
# approach  — the standing tile next to the patch (player walks here to gather).
# label     — hover label shown on the node.
# The patch depletes when picked and regrows after a short delay.

