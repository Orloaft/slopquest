# yaml-language-server: $schema=./schema/npcs.schema.json
# All non-player characters. Vendors, quest givers, guides — all in one place.
#
# role: vendor | quest | guide | alchemist
#   vendor    — opens the shop UI when interacted with.
#   quest     — drives a quest dialogue. The id must match a quest's `giver` field.
#   guide     — speaks idleDialogue. Currently used for flavor NPCs.
#   alchemist — opens the alchemist craft menu (buy flasks/kit, brew potions).
#
# at: { floor, x, y }  — tile-coordinate placement.
# idleDialogue          — what they say when they have nothing quest-specific to share.

- id: trader
  name: Wayfarer Trader
  role: vendor
  at: { floor: 0, x: 17.5, y: 15.5 }
  idleDialogue: "Need supplies? Stand close and open the shop."

- id: northwatch
  name: Northwatch Guide
  role: guide
  at: { floor: 4, x: 25.5, y: 16.5 }
  idleDialogue: "Northwatch is quiet for now."

- id: cemetery-warden
  name: Mira Gravewatch
  role: quest
  at: { floor: 0, x: 18.5, y: 18.5 }
  idleDialogue: "Southgate Cemetery is restless."

- id: lumberjack
  name: Brann Splitlog
  role: quest
  at: { floor: 0, x: 22.5, y: 16.5 }
  idleDialogue: "Pine yards are short on stock."

- id: hunter
  name: Kael Brookfoot
  role: quest
  at: { floor: 0, x: 15.5, y: 19.5 }
  idleDialogue: "The shamans in Northwood worry me."

- id: merchant
  name: Marda Vell
  role: quest
  at: { floor: 0, x: 20.5, y: 19.5 }
  idleDialogue: "Orcs raided my cart on the north road."

- id: alchemist
  name: Sage Ellwyn
  role: alchemist
  at: { floor: 0, x: 25.5, y: 16.5 }
  idleDialogue: "Bring me wild herbs and a flask, and I'll show you how to brew."

# Class trainers (role: trainer) — gate the Tier-1 classes once skill
# thresholds are met. See CLASS_UNLOCKS in src/shared.ts.
- id: fighter-captain
  name: Captain Doran
  role: trainer
  at: { floor: 0, x: 28.5, y: 18.5 }
  idleDialogue: "Hold the line, recruit. Earn your steel and I'll make you a Vanguard."

- id: shady-contact
  name: Sly Nessa
  role: trainer
  at: { floor: 0, x: 14.5, y: 16.5 }
  idleDialogue: "Quick hands and quicker feet. Show me, and the Thief's trade is yours."

- id: cleric-monk
  name: Brother Aldric
  role: trainer
  at: { floor: 0, x: 27.5, y: 14.5 }
  idleDialogue: "Patience and poultices. An Apothecary mends what blades break."

- id: scout-leader
  name: Ranger Wynn
  role: trainer
  at: { floor: 4, x: 23.5, y: 16.5 }
  idleDialogue: "A steady draw and a forager's eye. That's how an Archer is made."

- id: hermit-academic
  name: Magister Vael
  role: trainer
  at: { floor: 4, x: 27.5, y: 16.5 }
  idleDialogue: "Power answers study. Master the arcane and become a Mage."

- id: marsh-alchemist
  name: Bogwarden Yssa
  role: alchemist
  at: { floor: 5, x: 5.5, y: 17.5 }
  idleDialogue: "The marsh gives freely to those who know where to look. Brew well."

- id: frontier-trader
  name: Quartermaster Hale
  role: vendor
  at: { floor: 6, x: 66.5, y: 18.5 }
  idleDialogue: "Frontier Camp's the last stop before the deep canyons. Stock up."

- id: oasis-trader
  name: Caravan Master Zafira
  role: vendor
  at: { floor: 7, x: 22.5, y: 52.5 }
  idleDialogue: "The Oasis Outpost trades in glass and water. Rest, then trek on."

# --- Faction quest-givers (tie the biomes together) ---
- id: iron-census-officer
  name: Sergeant Vex
  role: quest
  at: { floor: 0, x: 30.5, y: 18.5 }
  idleDialogue: "The Iron Census holds the line. Broken gear doesn't fortify a frontier."

- id: syndicate-contact
  name: Fence Corbin
  role: quest
  at: { floor: 0, x: 12.5, y: 16.5 }
  idleDialogue: "Keep your voice down. The Syndicate has work for quiet hands."

- id: faith-monk
  name: Brother Tidewell
  role: quest
  at: { floor: 5, x: 13.5, y: 14.5 }
  idleDialogue: "The tides rise to cleanse us. The Sunken Faith only helps the willing adapt."

- id: ranger-scout
  name: Ranger Sable
  role: quest
  at: { floor: 8, x: 25.5, y: 5.5 }
  idleDialogue: "The Borderland Rangers cull what the wild overflows. Prove your aim."

- id: cartographer-adept
  name: Adept Lyra
  role: quest
  at: { floor: 7, x: 44.5, y: 52.5 }
  idleDialogue: "The Arcane Cartographers chart the ley-bleed. The desert hums with loose power."
