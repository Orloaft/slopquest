# yaml-language-server: $schema=./schema/spawns.schema.json
# World placements.
#
# monsters — every monster spawn point. type must match a monster id from monsters.yaml.
#            zone must be one of: southTown, cemetery, crypt, woods, northTown.
# trees    — manually placed composed trees (in addition to procedurally generated tile trees).

monsters:
  # Southgate Cemetery (90x60): skeletons/ghouls roam the fenced grave plots and
  # the winding paths between them. (13,12) is the NW-plot skeleton the dodge/
  # ranged e2e tests drop next to.
  - { type: skeleton,      at: { floor: 1, x: 16, y: 14 }, zone: cemetery }
  - { type: ghoul,         at: { floor: 1, x: 37, y: 26 }, zone: cemetery }
  - { type: grave_revenant, at: { floor: 1, x: 55, y: 18 }, zone: cemetery }
  - { type: skeleton,      at: { floor: 1, x: 87, y: 29 }, zone: cemetery }
  - { type: ghoul,         at: { floor: 1, x: 22, y: 58 }, zone: cemetery }
  - { type: pale_banshee,  at: { floor: 1, x: 66, y: 52 }, zone: cemetery }
  - { type: skeleton,      at: { floor: 1, x: 86, y: 59 }, zone: cemetery }
