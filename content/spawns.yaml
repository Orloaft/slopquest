# yaml-language-server: $schema=./schema/spawns.schema.json
# World placements.
#
# monsters — every monster spawn point. type must match a monster id from monsters.yaml.
#            zone must be one of: southTown, cemetery, crypt, woods, northTown.
# trees    — manually placed composed trees (in addition to procedurally generated tile trees).

monsters:
  - { type: skeleton,      at: { floor: 1, x: 13, y: 12 }, zone: cemetery }
  - { type: ghoul,         at: { floor: 1, x: 31, y: 13 }, zone: cemetery }
  - { type: skeleton,      at: { floor: 1, x: 18, y: 25 }, zone: cemetery }
  - { type: ghoul,         at: { floor: 1, x: 38, y: 25 }, zone: cemetery }
  - { type: skeleton,      at: { floor: 2, x: 13, y: 9  }, zone: crypt }
  - { type: ghoul,         at: { floor: 2, x: 22, y: 23 }, zone: crypt }
  - { type: skeleton,      at: { floor: 2, x: 33, y: 12 }, zone: crypt }
  - { type: ghoul,         at: { floor: 2, x: 39, y: 24 }, zone: crypt }
  - { type: boss,          at: { floor: 2, x: 43, y: 17 }, zone: crypt }
  # Northwood (90x60): the same roster spread thin across the expanded wood —
  # gentle critters near the Waystone arrival in the south, tougher greenskins
  # deeper north and out toward the marsh/badlands gates.
  - { type: rat,           at: { floor: 3, x: 38, y: 52 }, zone: woods }
  - { type: spider,        at: { floor: 3, x: 52, y: 52 }, zone: woods }
  - { type: goblin_scout,  at: { floor: 3, x: 28, y: 46 }, zone: woods }
  - { type: goblin_scout,  at: { floor: 3, x: 60, y: 47 }, zone: woods }
  - { type: goblin_scout,  at: { floor: 3, x: 16, y: 38 }, zone: woods }
  - { type: wolf,          at: { floor: 3, x: 12, y: 50 }, zone: woods }
  - { type: wolf,          at: { floor: 3, x: 74, y: 49 }, zone: woods }
  - { type: wolf,          at: { floor: 3, x: 34, y: 40 }, zone: woods }
  - { type: wolf,          at: { floor: 3, x: 58, y: 34 }, zone: woods }
  - { type: wisp,          at: { floor: 3, x: 24, y: 52 }, zone: woods }
  - { type: wisp,          at: { floor: 3, x: 54, y: 55 }, zone: woods }
  - { type: wisp,          at: { floor: 3, x: 10, y: 42 }, zone: woods }
  - { type: wisp,          at: { floor: 3, x: 77, y: 40 }, zone: woods }
  - { type: wisp,          at: { floor: 3, x: 47, y: 44 }, zone: woods }
  - { type: goblin,        at: { floor: 3, x: 29, y: 22 }, zone: woods }
  - { type: goblin,        at: { floor: 3, x: 60, y: 24 }, zone: woods }
  - { type: goblin_shaman, at: { floor: 3, x: 18, y: 9  }, zone: woods }
  - { type: goblin_shaman, at: { floor: 3, x: 74, y: 10 }, zone: woods }
  - { type: orc,           at: { floor: 3, x: 42, y: 7  }, zone: woods }
  - { type: orc,           at: { floor: 3, x: 56, y: 12 }, zone: woods }
  - { type: orc,           at: { floor: 3, x: 82, y: 24 }, zone: woods }
  # The Sunken Marsh (floor 5): skitterers patrol the causeway; mire spitters
  # are anchored on deep water and fire across it.
  - { type: skitterer,     at: { floor: 5, x: 38, y: 15 }, zone: marsh }
  - { type: skitterer,     at: { floor: 5, x: 22, y: 16 }, zone: marsh }
  - { type: skitterer,     at: { floor: 5, x: 18, y: 21 }, zone: marsh }
  - { type: skitterer,     at: { floor: 5, x: 10, y: 8  }, zone: marsh }
  - { type: mire_spitter,  at: { floor: 5, x: 32, y: 12 }, zone: marsh }
  - { type: mire_spitter,  at: { floor: 5, x: 24, y: 19 }, zone: marsh }
  - { type: mire_spitter,  at: { floor: 5, x: 12, y: 16 }, zone: marsh }
  # The Searing Badlands (floor 6): scavengers patrol in pairs (pack aggro);
  # dust burrowers lie hidden until a player steps on them.
  - { type: canyon_scavenger, at: { floor: 6, x: 12, y: 16 }, zone: badlands }
  - { type: canyon_scavenger, at: { floor: 6, x: 14, y: 17 }, zone: badlands }
  - { type: canyon_scavenger, at: { floor: 6, x: 32, y: 19 }, zone: badlands }
  - { type: canyon_scavenger, at: { floor: 6, x: 34, y: 20 }, zone: badlands }
  - { type: dust_burrower,    at: { floor: 6, x: 20, y: 10 }, zone: badlands }
  - { type: dust_burrower,    at: { floor: 6, x: 30, y: 19 }, zone: badlands }
  # The Sunken Desert (floor 7): fast dune skitterers + ruin-bound sun wraiths.
  - { type: dune_skitterer, at: { floor: 7, x: 15, y: 8  }, zone: desert }
  - { type: dune_skitterer, at: { floor: 7, x: 35, y: 12 }, zone: desert }
  - { type: dune_skitterer, at: { floor: 7, x: 22, y: 15 }, zone: desert }
  - { type: dune_skitterer, at: { floor: 7, x: 30, y: 20 }, zone: desert }
  - { type: sun_wraith,     at: { floor: 7, x: 21, y: 10 }, zone: desert }
  - { type: sun_wraith,     at: { floor: 7, x: 31, y: 12 }, zone: desert }
  # The Sunken Beach (floor 8): fast reef prowlers in the open sand.
  - { type: reef_prowler, at: { floor: 8, x: 10, y: 10 }, zone: beach }
  - { type: reef_prowler, at: { floor: 8, x: 30, y: 8  }, zone: beach }
  - { type: reef_prowler, at: { floor: 8, x: 20, y: 16 }, zone: beach }
  - { type: reef_prowler, at: { floor: 8, x: 42, y: 18 }, zone: beach }
  # The Untamed Jungle (floor 9): hidden stalkers ambush; totem wraiths fire down paths.
  - { type: venomous_stalker, at: { floor: 9, x: 16, y: 17 }, zone: jungle }
  - { type: venomous_stalker, at: { floor: 9, x: 40, y: 9  }, zone: jungle }
  - { type: totem_wraith,     at: { floor: 9, x: 24, y: 8  }, zone: jungle }
  - { type: totem_wraith,     at: { floor: 9, x: 43, y: 12 }, zone: jungle }

