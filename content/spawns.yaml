# yaml-language-server: $schema=./schema/spawns.schema.json
# World placements.
#
# monsters — every monster spawn point. type must match a monster id from monsters.yaml.
#            zone must be one of: southTown, cemetery, crypt, woods, northTown.
# trees    — manually placed composed trees (in addition to procedurally generated tile trees).

monsters:
  # Southgate Cemetery (110x72): skeletons/ghouls roam the fenced grave plots and
  # the winding paths between them. The player arrives at the NORTH gate (55,2).
  # A low husk/shambler band (L11-14) now holds the entry so "Thin the Cemetery"
  # is doable for a ~L12 newcomer fresh from the woods; the original L26-33 undead
  # still brood deeper in (positions preserved — dodge/ranged/bugfix e2e tests
  # drop next to the NW skeleton at 16,14 and the far-east one at 87,29).
  # -- new entry band (L11-14), just inside the north gate --
  - { type: restless_husk,  at: { floor: 1, x: 55, y: 7  }, zone: cemetery }
  - { type: restless_husk,  at: { floor: 1, x: 50, y: 14 }, zone: cemetery }
  - { type: restless_husk,  at: { floor: 1, x: 62, y: 15 }, zone: cemetery }
  - { type: grave_shambler, at: { floor: 1, x: 44, y: 12 }, zone: cemetery }
  - { type: grave_shambler, at: { floor: 1, x: 68, y: 26 }, zone: cemetery }
  # -- original undead (unchanged positions): L26-33, deeper in --
  - { type: skeleton,      at: { floor: 1, x: 16, y: 14 }, zone: cemetery }
  - { type: ghoul,         at: { floor: 1, x: 37, y: 26 }, zone: cemetery }
  - { type: grave_revenant, at: { floor: 1, x: 55, y: 18 }, zone: cemetery }
  - { type: skeleton,      at: { floor: 1, x: 87, y: 29 }, zone: cemetery }
  - { type: ghoul,         at: { floor: 1, x: 22, y: 58 }, zone: cemetery }
  - { type: pale_banshee,  at: { floor: 1, x: 66, y: 52 }, zone: cemetery }
  - { type: skeleton,      at: { floor: 1, x: 86, y: 59 }, zone: cemetery }
  # The Ashen Crypt (90x60): the Broken Reach's FIRST DUNGEON, re-tiered for the
  # 1-15 arc. A west-to-east danger gradient — Restless Husks (L11) at the entry
  # chambers, Grave Shamblers (L14) through the middle, Bound Wights (L16) in the
  # deep halls — climbing to the Ashen Warden (~L21 capstone boss, telegraphed
  # heavy slam) in the far-east vault. Was a wall of L26-45 undead + an orphaned
  # L95 boss, unbeatable for anyone who could actually reach it from the cemetery.
  - { type: restless_husk,  at: { floor: 2, x: 12, y: 11 }, zone: crypt }
  - { type: restless_husk,  at: { floor: 2, x: 15, y: 41 }, zone: crypt }
  - { type: grave_shambler, at: { floor: 2, x: 23, y: 45 }, zone: crypt }
  - { type: grave_shambler, at: { floor: 2, x: 38, y: 19 }, zone: crypt }
  - { type: grave_shambler, at: { floor: 2, x: 48, y: 17 }, zone: crypt }
