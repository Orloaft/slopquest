# yaml-language-server: $schema=./schema/combat-animations.schema.json
# Named combat animation contracts. These entries intentionally wrap today's
# renderer primitives first; later passes can point the same ids at generated
# sheets without changing ability or monster content.

- id: melee.slash.light
  kind: melee_arc
  renderer: slash_arc
  source: effects
  frames: 6
  frameMs: 45
  anchor: target
  orientation: rotate_to_target
  z: above_actor
  scale: 1
  hitFrame: 2

