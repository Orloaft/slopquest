# yaml-language-server: $schema=./schema/items.schema.json
# Items players can hold in inventory.
#
# Required fields: id, label
# Optional fields: icon, iconUrl, stackable, tags, capabilities, use
#
# id            — unique snake_case identifier. Used everywhere else (drops, vendor, quests).
# label         — display name shown to the player.
# icon          — short character code used as the fallback inventory glyph.
# iconUrl       — path under public/ to the inventory icon image (or null).
# stackable     — true if the item stacks in one inventory slot.
# tags          — free-form labels (food, tool, consumable, quest, …) for future filtering.
# capabilities  — list of capability ids this item grants while carried. Used by tool
#                 checks (e.g. `chop_tree`, `fish`). Authors compose from the known set.
# use           — what happens when the player uses the item. See "Use verbs" below.
#
# === Use verbs (Phase 2) ===
#
# Each `use` block must have a `kind` matching one of the engine verbs:
#
#   eat            — consume one of the item and apply effects.
#                    fields: restoreHp (number, optional)
#                            buffs (list, optional): each entry { id, durationMs }
#                            float (string, optional): float text shown on the player
#
#   light_fire     — consume one of `consumesAny` items at the player's feet to start a fire.
#                    fields: consumesAny (list): each { item, qty, xp }
#                            skill (string, optional): xp goes to this skill
#                            durationMs (number, optional): how long the fire burns
#
#   cook_on_fire   — start a cooking action on the targeted fire.
#                    fields: produces (item id): result on success
#                            burns (item id): result on failure
#                            skill (string, optional): xp goes to this skill
#                            xp (number): xp awarded on success
#
#   drink_potion   — consume one of the item, heal restoreHp.
#                    fields: restoreHp (number)
#                            float (string, optional)

- id: axe
  label: Bronze Axe
  icon: A
  iconUrl: /icons/item-axe.png
  stackable: false
  tags: [tool]
  capabilities: [chop_tree]
  weight: 2

- id: fishing_rod
  label: Fishing Rod
  icon: R
  iconUrl: /icons/item-fishing-rod.png
  stackable: false
  tags: [tool]
  capabilities: [fish]
  weight: 2

- id: pickaxe
  label: Bronze Pickaxe
  icon: P
  iconUrl: /icons/item-pickaxe.png
  stackable: false
  tags: [tool]
  capabilities: [mine]
  weight: 3

- id: flint_steel
  label: Flint and Steel
  icon: F
  iconUrl: /icons/item-flint-steel.png
  stackable: false
  tags: [tool]
  use:
    kind: light_fire
    consumesAny:
      - { item: logs, qty: 1, xp: 10 }
      - { item: pine_logs, qty: 1, xp: 18 }
    skill: firemaking
    durationMs: 120000

- id: logs
  label: Oak Logs
  icon: L
  iconUrl: /icons/item-logs.png
  stackable: true
  tags: [material]
  weight: 1

- id: pine_logs
  label: Pine Logs
  icon: P
  iconUrl: /icons/item-pine-logs.png
  stackable: true
  tags: [material]
  weight: 1

- id: copper_ore
  label: Copper Ore
  icon: Cu
  iconUrl: /icons/item-copper-ore.png
  stackable: true
  tags: [material]
  weight: 2

- id: raw_fish
  label: Raw Fish
  icon: rF
  iconUrl: /icons/item-raw-fish.png
  stackable: true
  tags: [food, raw]
  use:
    kind: cook_on_fire
    produces: cooked_fish
    burns: burnt_fish
    skill: cooking
    xp: 22

- id: cooked_fish
  label: Cooked Fish
  icon: cF
  iconUrl: /icons/item-cooked-fish.png
  stackable: true
  tags: [food, consumable]
  use:
    kind: eat
    restoreHp: 6
    buffs:
      - id: food_regen
        durationMs: 18000
      - id: well_fed
        durationMs: 90000
    float: Well fed

- id: burnt_fish
  label: Burnt Fish
  icon: bF
  iconUrl: /icons/item-burnt-fish.png
  stackable: true
  tags: [food, ruined]

- id: potion
  label: Health Potion
  icon: P
  iconUrl: /icons/item-potion.png
  stackable: true
  tags: [consumable]
  use:
    kind: drink_potion
    restoreHp: 58

- id: herb
  label: Wild Herb
  icon: H
  iconUrl: /icons/item-herb.png
  stackable: true
  tags: [herb, raw]

- id: empty_flask
  label: Empty Flask
  icon: eF
  iconUrl: /icons/item-empty-flask.png
  stackable: true
  tags: [container]

- id: alchemy_kit
  label: Alchemy Kit
  icon: aK
  iconUrl: /icons/item-alchemy-kit.png
  stackable: false
  tags: [tool]
  weight: 4

- id: hunting_bow
  label: Hunting Bow
  icon: bow
  iconUrl: /icons/item-hunting-bow.png
  stackable: false
  tags: [tool, weapon]
  capabilities: [ranged]
  weight: 3

- id: stolen_goods
  label: Stolen Cargo
  icon: S
  iconUrl: null
  stackable: true
  tags: [quest]

- id: quartz
  label: Glass-Sand Quartz
  icon: Qz
  iconUrl: /icons/item-quartz.png
  stackable: true
  tags: [material]
  weight: 1

- id: black_ledger
  label: Black-Market Ledger
  icon: BL
  iconUrl: /icons/item-quartz.png
  stackable: true
  tags: [quest]

- id: broken_reach_map
  label: Inked Survey of The Broken Reach
  icon: Map
  iconUrl: /icons/item-map.png
  stackable: false
  tags: [tool, map]
