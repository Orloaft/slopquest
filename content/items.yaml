# Items players can hold in inventory.
#
# Required fields: id, label
# Optional fields: icon, iconUrl, stackable, tags, use (Phase 2)
#
# id          — unique snake_case identifier. Used everywhere else (drops, vendor, quests).
# label       — display name shown to the player.
# icon        — short character code used as the fallback inventory glyph.
# iconUrl     — path under public/ to the inventory icon image (or null).
# stackable   — true if the item stacks in one inventory slot.
# tags        — free-form labels (food, tool, consumable, quest, …) for future filtering.

- id: axe
  label: Bronze Axe
  icon: A
  iconUrl: /icons/item-axe.png
  stackable: false
  tags: [tool]

- id: fishing_rod
  label: Fishing Rod
  icon: R
  iconUrl: /icons/item-fishing-rod.png
  stackable: false
  tags: [tool]

- id: flint_steel
