# yaml-language-server: $schema=./schema/monsters.schema.json
# Monster catalog. Spawn placements live in spawns.yaml.
#
# Required: id, name, maxHp, speed, damage, attackMs, xp, gold, aggro, range
# Optional: drops
#
# damage / gold are [min, max] pairs.
# aggro is the detection range in tiles. range is melee/magic reach in tiles.
# drops fire whenever the monster dies (always rolled, not quest-gated).

- id: rat
  name: Rat
  role: trash
  description: "a mangy scavenger, bold only in numbers"
  maxHp: 28
  speed: 2.4
  damage: [3, 7]
  attackMs: 1000
  xp: 16
  gold: [3, 8]
  aggro: 5.5
  range: 1

