# The Ashen Crypt's capstone. Re-tiered from an orphaned L95 bruiser down to a
# beatable ~L21 first-dungeon boss for the Broken Reach 1-15 arc: a telegraphed
# heavy slam you can read and step out of, and a vault-hoard drop (potion + a
# gold-ore nugget that feeds the new sell/smith loops).
- id: boss
  name: Ashen Warden
  role: boss
  description: "keeper of the crypt's deepest, dust-choked vault"
  maxHp: 105
  speed: 1.6
  damage: [6, 10]
  attackMs: 1450
  xp: 90
  isUnholy: true
  faithXp: 60
  gold: [40, 75]
  aggro: 9
