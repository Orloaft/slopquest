# yaml-language-server: $schema=./schema/mining-nodes.schema.json
# Ore nodes a player can mine at.
#
# at        — the rock tile coordinates (sits on an impassable rock tile).
# approach  — the standing tile next to the rock (player walks here to mine).
# kind      — ore type (copper | tin | iron); picks the vein sprite. Defaults to copper.

# Ore outcrops scattered through Northwood (floor 3) — the starter veins,
# moved out of the Waystone town and spread across the wood.
- id: mine-3-8-49
  kind: copper
  at: { floor: 3, x: 8.5, y: 49.5 }
  approach: { x: 9.5, y: 49.5 }

- id: mine-3-80-12
  kind: tin
  at: { floor: 3, x: 80.5, y: 12.5 }
  approach: { x: 81.5, y: 12.5 }

- id: mine-3-78-47
  kind: iron
  at: { floor: 3, x: 78.5, y: 47.5 }
  approach: { x: 79.5, y: 47.5 }

# Ore veins embedded in the Searing Badlands canyon walls (floor 6, 90x60):
# the vein sits on the cliff face, mined from the floor below it.
- id: mine-6-5-40
  kind: copper
  at: { floor: 6, x: 5.5, y: 40.5 }
  approach: { x: 5.5, y: 41.5 }

- id: mine-6-13-40
  kind: copper
  at: { floor: 6, x: 13.5, y: 40.5 }
  approach: { x: 13.5, y: 41.5 }

- id: mine-6-41-43
  kind: iron
  at: { floor: 6, x: 41.5, y: 43.5 }
  approach: { x: 41.5, y: 44.5 }
