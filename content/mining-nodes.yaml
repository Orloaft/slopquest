# yaml-language-server: $schema=./schema/mining-nodes.schema.json
# Ore nodes a player can mine at.
#
# at        — the rock tile coordinates (sits on an impassable rock tile).
# approach  — the standing tile next to the rock (player walks here to mine).
# kind      — ore tier: copper | tin | iron | coal | silver | gold | mithril | adamant.
#             Selects the ore yielded, the Mining level required, and XP (see
#             ORE_TIERS in src/shared.ts). Defaults to copper. Higher tiers live
#             in the caves; surface veins stay copper/tin/iron.

# Ore outcrops scattered through Northwood (floor 3, enlarged 110x72) — the
# starter veins, spread across the wood. (Node ids keep their original tags.)
- id: mine-3-8-49
  kind: copper
  at: { floor: 3, x: 10.5, y: 59.5 }
  approach: { x: 11.5, y: 59.5 }

- id: mine-3-80-12
  kind: tin
  at: { floor: 3, x: 98.5, y: 14.5 }
  approach: { x: 99.5, y: 14.5 }

- id: mine-3-78-47
  kind: iron
  at: { floor: 3, x: 95.5, y: 56.5 }
  approach: { x: 96.5, y: 56.5 }

