<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tib MVP</title>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>

      <section id="join" class="join-panel">
        <div class="brand">Waystone</div>
        <p class="subcopy">A tiny shared dungeon for five brave friends.</p>
        <div class="roster">
          <div class="roster-head">
            <strong>Characters</strong>
            <button id="refreshRosterButton" type="button">Refresh</button>
          </div>
          <div id="rosterList" class="roster-list">Connecting...</div>
        </div>
        <label>
          New character
          <input id="nameInput" maxlength="18" autocomplete="off" value="wanderer" />
        </label>
        <p class="subcopy">Everyone starts as an Adventurer and grows through skills.</p>
        <button id="joinButton" class="primary">Create and enter world</button>
      </section>

      <div id="hud" class="hud hidden">
        <div class="top-left panel">
          <div class="identity">
            <strong id="charName">-</strong>
            <span id="classLabel">-</span>
          </div>
          <div class="bar hp"><span id="hpBar"></span><b id="hpText"></b></div>
          <div class="bar mana"><span id="manaBar"></span><b id="manaText"></b></div>
          <div class="bar xp"><span id="xpBar"></span><b id="xpText"></b></div>
        </div>

        <div class="top-right panel">
          <div class="stat-grid">
            <span>Level</span><b id="levelText">1</b>
            <span>Gold</span><b id="goldText">0</b>
            <span>Weapon</span><b id="weaponText">Basic</b>
            <span>Armor</span><b id="armorText">Cloth</b>
          </div>
          <div id="buffTracker" class="buff-tracker hidden"></div>
          <div id="questTracker" class="quest-tracker"></div>
          <div class="menu-buttons">
            <button id="skillsButton" type="button">Skills</button>
            <button id="inventoryButton" type="button">Inventory</button>
            <button id="abilitiesButton" type="button">Abilities</button>
          </div>
          <div id="netStats" class="net-stats">net -</div>
        </div>

        <div id="menuBackdrop" class="menu-backdrop hidden"></div>
        <div id="skillsPanel" class="center-panel menu-panel hidden">
          <div class="panel-head">
            <strong>Skills</strong>
            <button id="skillsCloseButton" type="button">Close</button>
          </div>
          <div id="skillTracker" class="skill-tracker"></div>
        </div>
        <div id="inventoryPanel" class="center-panel menu-panel hidden">
          <div class="panel-head">
            <strong>Inventory</strong>
            <button id="inventoryCloseButton" type="button">Close</button>
          </div>
          <div id="inventoryGrid" class="inventory-grid"></div>
        </div>
        <div id="abilitiesPanel" class="center-panel menu-panel hidden">
          <div class="panel-head">
            <strong>Abilities</strong>
            <button id="abilitiesCloseButton" type="button">Close</button>
          </div>
          <div id="abilitiesList" class="abilities-list"></div>
        </div>
        <div id="vendor" class="center-panel vendor hidden">
          <div class="panel-head">
            <strong>Wayfarer Trader</strong>
            <button id="vendorCloseButton" type="button">Close</button>
          </div>
          <div class="shop-grid">
            <button data-buy="weapon"><img src="/icons/shop-weapon.png" alt="" />Buy weapon</button>
            <button data-buy="armor"><img src="/icons/shop-armor.png" alt="" />Buy armor</button>
            <button data-buy="axe"><img src="/icons/item-axe.png" alt="" />Buy axe</button>
            <button data-buy="fishing_rod"><img src="/icons/item-fishing-rod.png" alt="" />Buy fishing rod</button>
            <button data-buy="pickaxe"><img src="/icons/item-pickaxe.png" alt="" />Buy pickaxe</button>
            <button data-buy="flint_steel"><img src="/icons/item-flint-steel.png" alt="" />Buy flint and steel</button>
            <button data-buy="potion"><img src="/icons/item-potion.png" alt="" />Buy potion</button>
          </div>
        </div>
        <div id="dialogue" class="center-panel dialogue hidden">
          <div class="dialogue-speaker" id="dialogueSpeaker"></div>
          <div class="dialogue-line" id="dialogueLine"></div>
          <button id="dialogueNextButton" type="button">Continue</button>
        </div>

        <div class="bottom-left panel chat">
          <div id="chatLog"></div>
          <form id="chatForm">
            <input id="chatInput" maxlength="120" autocomplete="off" placeholder="party chat..." />
          </form>
        </div>

        <div id="hotbar" class="hotbar panel"></div>

        <div id="minimap" class="minimap panel">
          <canvas id="minimapCanvas" class="minimap-canvas" width="156" height="102"></canvas>
          <canvas id="compassCanvas" class="compass" width="46" height="46"></canvas>
          <div id="minimapZone" class="minimap-zone">-</div>
        </div>

        <div id="itemPopover" class="item-popover hidden"></div>

        <div id="death" class="death hidden panel">
          <strong>You fell.</strong>
          <button id="respawnButton">Respawn at temple</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
