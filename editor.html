<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tile Editor</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; background: #14181d; color: #d8dee4; }
      #app { display: flex; height: 100vh; }
      #side { width: 248px; flex: none; background: #1b2128; border-right: 1px solid #2c343d; display: flex; flex-direction: column; overflow: hidden; }
      #stage { flex: 1; position: relative; overflow: hidden; background: #0d1014; }
      #view { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7d8a98; margin: 14px 10px 6px; }
      .pad { padding: 0 10px; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 10px; }
      button { background: #283139; color: #d8dee4; border: 1px solid #3a4651; border-radius: 5px; padding: 5px 9px; cursor: pointer; font: inherit; }
      button:hover { background: #313c46; }
      button.on { background: #2d6cdf; border-color: #2d6cdf; color: #fff; }
      label.tog { display: flex; align-items: center; gap: 5px; padding: 3px 10px; cursor: pointer; }
      #roster, #atlasGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px 10px; overflow-y: auto; }
      #roster { max-height: 240px; }
      .swatch { position: relative; aspect-ratio: 1; border: 2px solid #3a4651; border-radius: 5px; image-rendering: pixelated; cursor: pointer; background-size: cover; }
      .swatch.sel { border-color: #ffcc44; box-shadow: 0 0 0 1px #ffcc44; }
      .swatch .col { position: absolute; right: 1px; bottom: 1px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid #0008; }
      .swatch .ch { position: absolute; left: 1px; top: 0; font-size: 9px; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
      #atlasWrap { flex: 1; overflow-y: auto; border-top: 1px solid #2c343d; display: none; }
      #atlasWrap.show { display: block; }
      #atlasGrid { grid-template-columns: repeat(8, 1fr); }
      .acell { aspect-ratio: 1; image-rendering: pixelated; cursor: pointer; border: 1px solid #2c343d; background-size: cover; }
      .acell:hover { outline: 2px solid #ffcc44; outline-offset: -2px; }
      #addForm { padding: 8px 10px; border-top: 1px solid #2c343d; display: none; }
      #addForm.show { display: block; }
      #addForm input[type=text] { width: 100%; background: #0d1014; border: 1px solid #3a4651; color: #d8dee4; border-radius: 4px; padding: 4px; margin: 4px 0; }
      #status { padding: 6px 10px; font-size: 12px; color: #8aa0b4; border-top: 1px solid #2c343d; min-height: 30px; white-space: pre-wrap; }
      #hud { position: absolute; left: 8px; bottom: 8px; background: #1b2128cc; border: 1px solid #2c343d; border-radius: 5px; padding: 4px 8px; font-size: 11px; color: #9fb0c0; pointer-events: none; }
      #ctx { position: fixed; z-index: 50; background: #222b33; border: 1px solid #3a4651; border-radius: 6px; padding: 4px; display: none; min-width: 156px; box-shadow: 0 6px 20px #0009; }
      #ctx.show { display: block; }
      #ctx .it { padding: 6px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
      #ctx .it:hover { background: #2d6cdf; }
      #ctx .it.dis { opacity: .45; pointer-events: none; cursor: default; }
      #ctx .sep { height: 1px; background: #3a4651; margin: 4px 0; }
      .spacer { flex: 1; }
      small { color: #6c7986; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side">
        <h2>Stage</h2>
        <div class="row"><select id="stageSel" style="flex:1; background:#0d1014; color:#d8dee4; border:1px solid #3a4651; border-radius:5px; padding:5px;"></select></div>

        <h2>Tools</h2>
        <div class="row">
          <button id="tPaint" class="on">Paint</button>
          <button id="tErase">Erase</button>
          <button id="tPick">Eyedropper</button>
          <button id="tRot" title="Rotate hovered tile, or the brush (R)">Rotate ⟳</button>
        </div>
        <label class="tog"><input type="checkbox" id="optCol" /> Collision overlay</label>
        <label class="tog"><input type="checkbox" id="optTrees" /> Show trees/props</label>
        <label class="tog"><input type="checkbox" id="optGrid" checked /> Grid</label>

        <div id="autotilePanel" style="display:none">
          <h2>Auto-tile <small>(paint membership; edges auto-fit)</small></h2>
          <div class="row" id="autotileTools"></div>
        </div>

        <div id="layerPanel" style="display:none">
          <h2>Layers <small id="layerHint"></small></h2>
          <div class="row" id="layerTools">
            <button id="layerSpawns">👹 Enemy spawns</button>
          </div>
          <div id="spawnPanel" style="display:none">
            <div class="row">
              <select id="spawnType" style="flex:1; background:#0d1014; color:#d8dee4; border:1px solid #3a4651; border-radius:5px; padding:5px;"></select>
            </div>
            <small style="display:block; padding:2px 10px; color:#6c7986;">Click empty tile = place · drag a marker = move · right-click / Del = delete. ◯ = from spawns.yaml, ● = editor-placed.</small>
          </div>
        </div>

        <h2>Roster <small>(click to select)</small></h2>
        <div id="roster"></div>

        <div class="row">
          <button id="toggleAtlas">Browse atlas ▾</button>
        </div>
        <div id="atlasWrap">
          <div id="addForm">
            <div>Tile <b id="addRef"></b></div>
            <input type="text" id="addName" placeholder="name (e.g. lush-grass)" />
            <label class="tog"><input type="checkbox" id="addBlocked" /> Blocks movement</label>
            <label class="tog"><input type="checkbox" id="addRoad" /> Is road</label>
            <div class="row"><button id="addGo" class="on">Add to roster</button><button id="addCancel">Cancel</button></div>
          </div>
          <div id="atlasGrid"></div>
        </div>

        <div class="spacer"></div>
        <div class="row"><button id="save" class="on" style="flex:1">💾 Save & rebuild</button></div>
        <div id="status">Loading…</div>
      </div>
      <div id="stage">
        <canvas id="view"></canvas>
        <div id="hud"></div>
      </div>
    </div>
    <div id="ctx"></div>

    <script type="module">
      let TS = 32, ACOLS = 24;      // tile px + atlas columns — set per-stage from the API
      let ATLAS_NAME = "forest";    // tileset name used in refs ("<name>:<index>") — set per-stage
      let eraseChar = "F";          // the stage's background char; Erase paints this. Set per-stage.
      let stageName = "";           // current stage id, sent on save
      const $ = (id) => document.getElementById(id);
      const view = $("view"), vctx = view.getContext("2d");
      let D = null;                 // state from server
      let atlas = null;             // Image
      let atlasRead = null;         // canvas for pixel sampling
      let map = null, mctx = null;  // offscreen pre-rendered map
      const overrides = new Map();  // "x,y" -> {char, ref, blocked}
      const legendAdds = {}, vocabAdds = {};
      const blobChars = new Set();  // chars minted to back a blob autotile set (road/water).
                                    // Hidden from the roster; only the ones actually painted are saved.
      let roster = [];              // {char, ref, blocked, road, sightBlocked, role, minimapColor}
      let sel = null;               // selected roster entry
      let tool = "paint";           // paint | erase | pick | autotile | tint
      let brushRot = 0;             // 0/90/180/270 applied to new paints
      let activePart = null;        // selected autotile part (paint membership + reflow)
      let activeTintPart = null;    // selected part for the tint/recolor flood
      let activePartList = [];      // autotile parts available for the loaded stage
      const cam = { scale: 1, x: 0, y: 0 };
      let painting = false, panning = false, panStart = null;
      let hover = null;             // {x,y}

      // ---- Layers (point-entity editing on top of the tile grid) ----
      // layerMode === null → normal tile painting. When a layer is active, clicks
      // place/select/move that layer's point-entities instead of painting tiles.
      // First layer: enemy spawns (writes content/spawns.editor.yaml via the API).
      let layerMode = null;             // null | "spawns"
      let spawnList = [];               // [{type,x,y,source:'base'|'overlay',baseKey?}]
      let removedBaseKeys = new Set();  // "x,y" of base (spawns.yaml) spawns to suppress
      let spawnSel = null;              // selected spawn (move/delete target)
      let spawnType = null;             // monster id to place
      let draggingSpawn = null;         // spawn being dragged
      let spawnsDirty = false;          // pending spawn edits to save

      const refXY = (ref) => { const n = +ref.split(":")[1]; return [(n % ACOLS) * TS, Math.floor(n / ACOLS) * TS]; };
      const key = (x, y) => x + "," + y;
      const charAt = (x, y) => overrides.get(key(x, y))?.char ?? D.ascii[y][x];
      const displayRef = (x, y) => {
        const o = overrides.get(key(x, y)); if (o) return o.ref;
        return (D.fringe && D.fringe[y][x]) || D.base[y][x] || D.legend[D.ascii[y][x]];
      };
      const blockedChar = (ch) => !!(vocabAdds[ch] ?? D.vocab[ch])?.blocked;
      const cellRot = (x, y) => overrides.get(key(x, y))?.rot ?? D.rotations[key(x, y)] ?? 0;

      // Wipe all per-stage editing state so switching stages can't leak edits,
      // roster, or undo history from the previously loaded region.
      function resetState() {
        overrides.clear();
        for (const k of Object.keys(legendAdds)) delete legendAdds[k];
        for (const k of Object.keys(vocabAdds)) delete vocabAdds[k];
        blobChars.clear();
        undoStack.length = 0;
        roster = []; sel = null; brushRot = 0; hover = null;
        tool = "paint"; activePart = null; activeTintPart = null; userMoved = false;
        layerMode = null; spawnList = []; removedBaseKeys = new Set();
        spawnSel = null; spawnType = null; draggingSpawn = null; spawnsDirty = false;
        $("addForm").classList.remove("show");
      }

      // The stage's "background" is the most common char in its ascii grid — that's
      // what Erase paints. Northwood→F (floor), swamp→W (water), etc. Generic across
      // stages instead of the old hardcoded "F".
      function dominantChar() {
        const freq = {};
        for (const row of D.ascii) for (const c of row) freq[c] = (freq[c] || 0) + 1;
        let best = null, n = -1;
        for (const [c, k] of Object.entries(freq)) if (k > n && D.legend[c]) { best = c; n = k; }
        return best;
      }

      // Which autotile parts apply to the loaded stage — a part is offered only when
      // every char it NEEDS exists in the legend (so e.g. plateau shows only on stages
      // whose atlas carries the plateau tiles). Drives the data-driven auto-tile panel.
      function computeActiveParts() {
        activePartList = terrainParts().filter((p) => p.needs.every((ch) => ch in D.legend));
      }

      async function loadStages() {
        const el = $("stageSel");
        try {
          const { stages, error } = await (await fetch("/editor/api/stages")).json();
          if (error || !stages?.length) { el.innerHTML = "<option>northwood</option>"; return; }
          el.innerHTML = stages.map((s) => `<option value="${s}">${s}</option>`).join("");
        } catch { el.innerHTML = "<option>northwood</option>"; }
        el.onchange = () => {
          if ((overrides.size || Object.keys(legendAdds).length) &&
              !confirm("Discard unsaved edits and switch stage?")) { el.value = stageName; return; }
          loadStage(el.value);
        };
      }

      async function loadStage(name) {
        resetState();
        stageName = name;
        $("status").textContent = `Loading ${name}…`;
        D = await (await fetch("/editor/api/state?stage=" + encodeURIComponent(name))).json();
        if (D.error) { $("status").textContent = "Load error: " + D.error; return; }
        TS = D.tileSize || 32; ACOLS = D.atlasCols || 24; ATLAS_NAME = D.atlasName || "forest";
        eraseChar = dominantChar() || "F";
        $("tErase").textContent = "Erase→" + eraseChar;
        $("stageSel").value = name;
        atlas = new Image(); atlas.src = D.atlasUrl;
        await atlas.decode();
        atlasRead = document.createElement("canvas"); atlasRead.width = atlas.width; atlasRead.height = atlas.height;
        atlasRead.getContext("2d").drawImage(atlas, 0, 0);
        prepareBlobsets();                      // mint blob tile chars (needs readable atlas) before the toolbar is built
        computeActiveParts(); buildAutotilePanel();
        map = document.createElement("canvas"); map.width = D.cols * TS; map.height = D.rows * TS; mctx = map.getContext("2d");
        mctx.imageSmoothingEnabled = false;
        buildRoster(); buildAtlas(); initLayers(); renderMapAll(); setTool(); resize();
        $("status").textContent = `Loaded ${D.name} — ${D.cols}×${D.rows}. Click a roster tile, then paint. Scroll=zoom, middle/space-drag=pan.`;
      }

      async function boot() {
        await loadStages();
        await loadStage($("stageSel").value || "northwood");
      }

      function buildRoster() {
        roster = [];
        const seen = new Set();
        const add = (ch) => {
          if (seen.has(ch) || blobChars.has(ch)) return; seen.add(ch);  // blob tiles are driven by the auto-tool, not hand-picked
          const ref = legendAdds[ch] ?? D.legend[ch]; const v = vocabAdds[ch] ?? D.vocab[ch];
          if (!ref || !v) return;
          roster.push({ char: ch, ref, ...v });
        };
        Object.keys(D.legend).forEach(add);
        Object.keys(legendAdds).forEach(add);
        const el = $("roster"); el.innerHTML = "";
        for (const t of roster) {
          const [sx, sy] = refXY(t.ref);
          const sw = document.createElement("div");
          sw.className = "swatch" + (sel?.char === t.char ? " sel" : "");
          sw.title = `${t.char} — ${t.role}${t.blocked ? " (blocks)" : ""}${t.road ? " (road)" : ""}`;
          sw.style.backgroundImage = `url(${D.atlasUrl})`;
          sw.style.backgroundPosition = `-${sx}px -${sy}px`;
          sw.style.backgroundSize = `${atlas.width}px ${atlas.height}px`;
          sw.innerHTML = `<span class="ch">${t.char}</span><span class="col" style="background:${t.blocked ? "#e0533d" : "#4fc46b"}"></span>`;
          sw.onclick = () => { clearLayer(); sel = t; tool = "paint"; setTool(); buildRoster(); };
          el.appendChild(sw);
        }
      }

      function buildAtlas() {
        const el = $("atlasGrid"); el.innerHTML = "";
        const total = ACOLS * Math.floor(atlas.height / TS);
        for (let n = 0; n < total; n++) {
          const ref = ATLAS_NAME + ":" + n;
          const [sx, sy] = refXY(ref);
          const c = document.createElement("div");
          c.className = "acell";
          c.title = ref;
          c.style.backgroundImage = `url(${D.atlasUrl})`;
          c.style.backgroundPosition = `-${sx}px -${sy}px`;
          c.style.backgroundSize = `${atlas.width}px ${atlas.height}px`;
          c.onclick = () => openAdd(ref);
          el.appendChild(c);
        }
      }

      let addRef = null;
      function openAdd(ref) {
        addRef = ref; $("addRef").textContent = ref; $("addForm").classList.add("show");
        $("addName").value = ""; $("addBlocked").checked = false; $("addRoad").checked = false; $("addName").focus();
      }
      function sampleColor(ref) {
        const [sx, sy] = refXY(ref);
        const d = atlasRead.getContext("2d").getImageData(sx + 16, sy + 16, 1, 1).data;
        return "#" + [d[0], d[1], d[2]].map((v) => v.toString(16).padStart(2, "0")).join("");
      }
      const CHARPOOL = "abcdeghijklnoprsuvwxzABCEGHIJKLOPQRTUVWXYZ0123456789+*#%&@!?<>=/";
      function mintChar() {
        const used = new Set([...Object.keys(D.legend), ...Object.keys(legendAdds)]);
        for (const c of CHARPOOL) if (!used.has(c)) return c;
        throw new Error("out of free tile chars");
      }
      $("addGo").onclick = () => {
        const ch = mintChar();
        const blocked = $("addBlocked").checked, road = $("addRoad").checked;
        const role = $("addName").value.trim() || ("tile-" + addRef.split(":")[1]);
        legendAdds[ch] = addRef;
        vocabAdds[ch] = { role, blocked, sightBlocked: blocked, road, minimapColor: sampleColor(addRef) };
        $("addForm").classList.remove("show");
        buildRoster();
        sel = roster.find((t) => t.char === ch); buildRoster();
        $("status").textContent = `Added '${role}' as roster tile '${ch}'. Selected — paint away.`;
      };
      $("addCancel").onclick = () => $("addForm").classList.remove("show");

      // ---- map rendering ----
      function renderCell(x, y) {
        const [sx, sy] = refXY(displayRef(x, y));
        mctx.clearRect(x * TS, y * TS, TS, TS);
        const deg = cellRot(x, y);
        if (deg) {
          mctx.save();
          mctx.translate(x * TS + TS / 2, y * TS + TS / 2);
          mctx.rotate((deg * Math.PI) / 180);
          mctx.drawImage(atlas, sx, sy, TS, TS, -TS / 2, -TS / 2, TS, TS);
          mctx.restore();
        } else {
          mctx.drawImage(atlas, sx, sy, TS, TS, x * TS, y * TS, TS, TS);
        }
      }
      function renderMapAll() { for (let y = 0; y < D.rows; y++) for (let x = 0; x < D.cols; x++) renderCell(x, y); }

      let userMoved = false;
      function fit() {
        if (!D) return;   // a ResizeObserver tick can race the first/async stage load
        if (view.clientWidth < 10 || view.clientHeight < 10) return;
        const s = Math.min(view.clientWidth / (D.cols * TS), view.clientHeight / (D.rows * TS)) * 0.98;
        cam.scale = s;
        cam.x = (view.clientWidth - D.cols * TS * s) / 2;
        cam.y = (view.clientHeight - D.rows * TS * s) / 2;
      }
      function resize() { view.width = view.clientWidth; view.height = view.clientHeight; if (!userMoved) fit(); draw(); }

      function draw() {
        if (!map) return;
        vctx.setTransform(1, 0, 0, 1, 0, 0);
        vctx.fillStyle = "#0d1014"; vctx.fillRect(0, 0, view.width, view.height);
        vctx.imageSmoothingEnabled = false;
        vctx.setTransform(cam.scale, 0, 0, cam.scale, cam.x, cam.y);
        vctx.drawImage(map, 0, 0);
        // visible cell bounds
        const x0 = Math.max(0, Math.floor(-cam.x / cam.scale / TS));
        const y0 = Math.max(0, Math.floor(-cam.y / cam.scale / TS));
        const x1 = Math.min(D.cols, Math.ceil((view.width - cam.x) / cam.scale / TS));
        const y1 = Math.min(D.rows, Math.ceil((view.height - cam.y) / cam.scale / TS));
        if ($("optCol").checked) {
          for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
            if (blockedChar(charAt(x, y))) { vctx.fillStyle = "rgba(224,83,61,0.38)"; vctx.fillRect(x * TS, y * TS, TS, TS); }
          }
        }
        if ($("optTrees").checked) {
          vctx.fillStyle = "rgba(70,200,120,0.30)"; vctx.strokeStyle = "rgba(120,255,170,0.6)"; vctx.lineWidth = 1 / cam.scale;
          for (const o of D.objects) { const w = o.w || TS, h = o.h || TS; vctx.fillRect(o.x * TS, o.y * TS - (h - TS), w, h); }
        }
        if ($("optGrid").checked && cam.scale > 0.25) {
          vctx.strokeStyle = "rgba(255,255,255,0.06)"; vctx.lineWidth = 1 / cam.scale; vctx.beginPath();
          for (let x = x0; x <= x1; x++) { vctx.moveTo(x * TS, y0 * TS); vctx.lineTo(x * TS, y1 * TS); }
          for (let y = y0; y <= y1; y++) { vctx.moveTo(x0 * TS, y * TS); vctx.lineTo(x1 * TS, y * TS); }
          vctx.stroke();
        }
        drawSpawns();
        if (hover) { vctx.strokeStyle = "#ffcc44"; vctx.lineWidth = 2 / cam.scale; vctx.strokeRect(hover.x * TS, hover.y * TS, TS, TS); }
      }

      // ---- interaction ----
      const cellAt = (cx, cy) => {
        const r = view.getBoundingClientRect();
        const x = Math.floor((cx - r.left - cam.x) / cam.scale / TS);
        const y = Math.floor((cy - r.top - cam.y) / cam.scale / TS);
        return x >= 0 && y >= 0 && x < D.cols && y < D.rows ? { x, y } : null;
      };
      // ---- mutation + undo machinery ----
      // Every edit goes through setCell, which records the prior value into the
      // current action. A stroke (drag) is one action; menu ops are one each.
      const undoStack = [];     // [ [{k, prev}] ]  prev = override value before, or undefined
      let curAction = null;
      let clipboard = null;     // {char, ref, blocked, rot}
      const beginAction = () => { curAction = []; };
      const endAction = () => { if (curAction && curAction.length) undoStack.push(curAction); curAction = null; };
      function setCell(x, y, val) {
        const k = key(x, y), ex = overrides.get(k);
        if (val && ex && ex.char === val.char && ex.rot === val.rot && ex.ref === val.ref) return false;
        if (curAction) curAction.push({ k, prev: ex ? { ...ex } : undefined });
        if (val) overrides.set(k, val); else overrides.delete(k);
        renderCell(x, y);
        return true;
      }
      function undo() {
        const a = undoStack.pop();
        if (!a) { $("status").textContent = "Nothing to undo."; return; }
        for (const { k, prev } of a) { if (prev === undefined) overrides.delete(k); else overrides.set(k, prev); const [x, y] = k.split(",").map(Number); renderCell(x, y); }
        $("status").textContent = `Undid ${a.length} cell(s). (${undoStack.length} more)`; draw();
      }
      function pickAt(x, y) { const ch = charAt(x, y); const t = roster.find((r) => r.char === ch); if (t) { sel = t; brushRot = cellRot(x, y); tool = "paint"; setTool(); buildRoster(); } }

      // ---- plateau autotiling ----------------------------------------------
      // One tool, two MATERIALS (grass top, rock wall). You paint membership;
      // each cell's exact tile — edge/corner for the top, cap/mid/foot + end
      // corners for the face — is derived from its neighbours and re-flows live
      // as you extend or erase. Membership is implied by which char-set a cell's
      // current char belongs to, so re-resolving is stateless.
      // top has two palettes: normal yellow-green + a bright "lit" set used to
      // highlight an elevated plateau. Both count as grass membership; the Tint
      // tool toggles a whole top between them, preserving each cell's edge/corner.
      const GRASS_NORMAL = ["g", "n", "A", "B", "w", "e"];
      const GRASS_LIT    = ["G", "H", "I", "J", "K", "L"];
      const LIT_OF  = { g: "G", n: "H", A: "I", B: "J", w: "K", e: "L" };
      const NORM_OF = { G: "g", H: "n", I: "A", J: "B", K: "w", L: "e" };
      const isLit = (ch) => ch in NORM_OF;
      const normRole = (ch) => NORM_OF[ch] || ch;   // bright→normal role char; normal→itself
      const GRASS_SET = new Set([...GRASS_NORMAL, ...GRASS_LIT]);          // walkable top
      const WALL_SET  = new Set(["c", "v", "b", "h", "i", "j", "k", "l", "o", "p", "r"]); // rock face
      const inBounds = (x, y) => x >= 0 && y >= 0 && x < D.cols && y < D.rows;
      const inGrass = (x, y) => inBounds(x, y) && GRASS_SET.has(charAt(x, y));
      const inWall  = (x, y) => inBounds(x, y) && WALL_SET.has(charAt(x, y));
      // is this grass an ELEVATED plateau top (vs. lowland)? Scan straight down through
      // the grass run; if the first non-grass cell below is a cliff WALL, the grass sits
      // atop a face → it's a top. Lowland grass scans down into forest/ground/edge, so it
      // never qualifies. This lets Tint stay on the plateau even when a side wall has a gap
      // that connects the top to the surrounding grass (which would otherwise leak the tint).
      function isElevatedTop(x, y) {
        if (!inGrass(x, y)) return false;
        let cy = y;
        while (inGrass(x, cy)) cy++;        // walk to first cell below the grass run
        return inWall(x, cy);               // top iff that cell is a cliff face
      }

      // top surface: N/W/E membership picks corner (A/B), edge (n/w/e) or fill (g).
      // South is intentionally ignored — the drop below the bottom row is the face.
      function resolveGrass(x, y) {
        const N = inGrass(x, y - 1), W = inGrass(x - 1, y), E = inGrass(x + 1, y);
        let role;
        if (!N && !W) role = "A";          // top-left corner
        else if (!N && !E) role = "B";     // top-right corner
        else if (!N) role = "n";           // top edge
        else if (!W) role = "w";           // left edge
        else if (!E) role = "e";           // right edge
        else role = "g";                   // interior
        return isLit(charAt(x, y)) ? LIT_OF[role] : role; // keep this cell's tint
      }
      // rock face: vertical band (cap / mid / foot) x horizontal end (L / mid / R).
      // FOOT-first: a 1-row wall is both cap and foot — render it as the foot, which
      // carries the grass base + baked contact shadow, so single-tier walls look right.
      function resolveWall(x, y) {
        const cap = !inWall(x, y - 1), foot = !inWall(x, y + 1);
        const L = !inWall(x - 1, y), R = !inWall(x + 1, y);
        const band = foot ? ["p", "b", "r"] : cap ? ["j", "c", "k"] : ["l", "v", "o"];
        return L ? band[0] : R ? band[2] : band[1];
      }
      function applyChar(x, y, ch) {
        const ref = legendAdds[ch] ?? D.legend[ch];
        const v = vocabAdds[ch] ?? D.vocab[ch];
        setCell(x, y, { char: ch, ref, blocked: !!(v && v.blocked), rot: 0 });
      }
      function autotileAt(x, y) {
        if (!inBounds(x, y)) return;
        const p = partAt(x, y);
        if (p) applyChar(x, y, p.resolve(x, y));
      }
      // contact shadow now lives baked inside the foot tiles' own grass base
      // (darkest at the rock-meets-ground line, fading out by the foot's bottom edge),
      // so there's no separate shadow tile to stack or mis-colour against the ground.
      // re-resolve a cell and its 8 neighbours (membership of the painted/erased
      // cell changes what its neighbours should be).
      function reflowAround(x, y) {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) autotileAt(x + dx, y + dy);
      }
      // wall-follow: the face height is a property you set by painting wall rows;
      // once set, widening the top drags the face along at that height so you
      // never re-paint walls just to keep them under the edge.
      // south edge of the top in column x = lowest grass cell with no grass below.
      function topSouthEdgeRow(x) {
        let best = -1;
        for (let y = 0; y < D.rows; y++) if (inGrass(x, y) && !inGrass(x, y + 1)) best = y;
        return best;
      }
      const wallRunBelow = (x, ge) => { let h = 0, y = ge + 1; while (inWall(x, y)) { h++; y++; } return h; };
      function extendWallToMatch(x, depth) {
        if (x < 0 || x >= D.cols || depth > D.cols) return;
        const ge = topSouthEdgeRow(x);
        if (ge < 0) return;                              // no top in this column
        const have = wallRunBelow(x, ge);
        const nb = (c) => { const g = topSouthEdgeRow(c); return g < 0 ? 0 : wallRunBelow(c, g); };
        const H = Math.max(nb(x - 1), nb(x + 1));        // match the taller neighbour
        if (H <= have) return;                           // already tall enough → stop (also halts propagation)
        for (let i = have; i < H; i++) applyChar(x, ge + 1 + i, "v"); // stamp the missing face rows
        for (let i = -1; i <= H + 1; i++) reflowAround(x, ge + i);    // re-resolve cap/mid/foot/corners
        extendWallToMatch(x - 1, depth + 1);             // carry the height along the edge, either drag direction
        extendWallToMatch(x + 1, depth + 1);
      }

      // ---- generic autotile engine (data-driven; Phase 1) --------------------
      // An autotile PART is a paintable membership layer: stamp its `fill` char and
      // every cell in the part re-resolves its exact tile from its neighbours via
      // `resolve`. Parts are pure data — a part is offered for a stage only when all
      // the chars it `needs` exist in the legend, so the toolbar is data-driven.
      // Plateau (grass top + rock wall) is the first group; road / water blob parts
      // slot straight in here once their edge tiles exist in a stage's atlas — give
      // them a `resolve: blobResolver(memberOf, bitmaskToChar)` (Phase 2).
      function terrainParts() {
        const parts = [
          { group: "Plateau", id: "grass", fill: "g", needs: GRASS_NORMAL,
            label: "🟩 Top", status: "Plateau TOP — paint the walkable grass; edges & corners auto-fit. Erase to reshape.",
            memberOf: inGrass, resolve: resolveGrass, afterPaint: (x, y) => extendWallToMatch(x, 0),
            tint: { lit: LIT_OF, norm: NORM_OF, requireElevated: true } },
          { group: "Plateau", id: "wall", fill: "v", needs: ["c", "v", "b", "h", "i", "j", "k", "l", "o", "p", "r"],
            label: "🟫 Wall", status: "Plateau WALL — paint the rock face below the top; caps, feet & end-corners auto-fit. More rows = taller cliff.",
            memberOf: inWall, resolve: resolveWall },
        ];
        // Blob autotile parts (road/water) are data — one per prepared blob set on this
        // stage. Membership = the set's own minted chars (so a stray reflow never rewrites
        // a legacy flat-road cell), while CONNECTIVITY also counts legacy road/water chars
        // so a freshly-painted path butts cleanly against tiles that predate the blob set.
        for (const set of (D.blobsets || [])) {
          if (!set._charByBitmask) continue;
          const member = (x, y) => inBounds(x, y) && set._memberChars.has(charAt(x, y));
          const connect = (x, y) => inBounds(x, y) && set._connectChars.has(charAt(x, y));
          parts.push({
            group: set.group, id: set.id, fill: set._fillChar, needs: [],
            label: set.label || `🧩 ${set.group}`,
            status: `${set.group} auto-tile — paint a path; straights, curves & junctions auto-fit from neighbours. Retune by editing ${stageName}.blobset.json (see docs/editor-autotile.md).`,
            memberOf: member, resolve: blobResolver(connect, set._charByBitmask, set._fillChar),
          });
        }
        return parts;
      }

      // Mint a roster-hidden char for every distinct atlas tile a blob set references,
      // then index it by bitmask so blobResolver can pick it. Reuses an existing legend
      // char when one already points at the same ref (e.g. the legacy flat-road tile),
      // so the saved map never grows duplicate tiles. Must run after the atlas pixels
      // are readable (sampleColor) and before computeActiveParts() builds the toolbar.
      function charForRef(ref, vocabEntry) {
        for (const [ch, r] of Object.entries(D.legend)) if (r === ref) return ch;
        for (const [ch, r] of Object.entries(legendAdds)) if (r === ref) return ch;
        const ch = mintChar();
        legendAdds[ch] = ref; vocabAdds[ch] = vocabEntry; blobChars.add(ch);
        return ch;
      }
      function prepareBlobsets() {
        for (const set of (D.blobsets || [])) {
          const prefix = set.atlas || ATLAS_NAME;
          const isRoad = set.id === "road";
          // Legacy tiles of the SAME terrain (matched by vocab role) count toward
          // connectivity, so a freshly-painted path/shore butts cleanly against the
          // pre-existing flat tiles (legacy road 't', legacy water '~', …).
          const legacy = set.role ? Object.keys(D.vocab).filter((ch) => (D.vocab[ch] || {}).role === set.role) : [];
          set._charByBitmask = {}; set._memberChars = new Set();
          for (let bm = 0; bm < 16; bm++) {
            const idx = set.tiles[bm] ?? set.tiles[String(bm)];
            if (idx == null) continue;
            const ref = prefix + ":" + idx;
            const ch = charForRef(ref, {
              role: `${set.id}-${bm}`, blocked: !!set.blocked, sightBlocked: !!set.blocked,
              road: isRoad, minimapColor: sampleColor(ref),
            });
            set._charByBitmask[bm] = ch; set._memberChars.add(ch);
          }
          set._fillChar = set._charByBitmask[set.paintBitmask ?? 15] ?? set._charByBitmask[15];
          set._connectChars = new Set([...set._memberChars, ...legacy]);
        }
      }
      function partAt(x, y) { if (!inBounds(x, y)) return null; for (const p of activePartList) if (p.memberOf(x, y)) return p; return null; }
      function paintPart(p, x, y) { applyChar(x, y, p.fill); reflowAround(x, y); p.afterPaint?.(x, y); }

      // 4-neighbour "blob" resolver for Phase 2 (roads / water): pick a tile char from
      // `map` keyed by the N|E|S|W membership bitmask (1|2|4|8). Supply a stage's
      // bitmask→char table once its atlas carries the 16 edge/corner variants.
      function blobResolver(memberOf, map, fallback) {
        return (x, y) => {
          const m = (memberOf(x, y - 1) ? 1 : 0) | (memberOf(x + 1, y) ? 2 : 0) | (memberOf(x, y + 1) ? 4 : 0) | (memberOf(x - 1, y) ? 8 : 0);
          return map[m] ?? fallback;
        };
      }

      // flood the connected part and toggle its whole palette (bright<->normal) based
      // on the clicked cell's current tint. One click = one undoable action. Generic
      // over any part that declares a `tint` palette (currently the plateau top).
      function tintFlood(p, x, y) {
        const pal = p?.tint; if (!pal) return;
        const lit = (ch) => ch in pal.norm;
        const norm = (ch) => pal.norm[ch] || ch;
        if (!p.memberOf(x, y)) { $("status").textContent = `Click a ${p.group.toLowerCase()} top to highlight it.`; return; }
        if (pal.requireElevated && !isElevatedTop(x, y)) { $("status").textContent = "That grass isn't an elevated top (no cliff face below it) — Tint only highlights plateaus."; return; }
        const makeLit = !lit(charAt(x, y));
        beginAction();
        const stack = [[x, y]], seen = new Set(); let n = 0; const CAP = 8000;
        while (stack.length && n < CAP) {
          const [cx, cy] = stack.pop(), k = key(cx, cy);
          if (seen.has(k) || !inBounds(cx, cy)) continue;
          seen.add(k);
          if (!p.memberOf(cx, cy) || (pal.requireElevated && !isElevatedTop(cx, cy))) continue; // stay on the part; never leak through a gap
          const role = norm(charAt(cx, cy));
          applyChar(cx, cy, makeLit ? pal.lit[role] : role);
          n++;
          stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
        }
        endAction();
        $("status").textContent = `${makeLit ? "Highlighted" : "Reset"} ${p.group.toLowerCase()} — ${n} cell(s).`;
      }

      // Build the auto-tile toolbar from the parts active for this stage: one button
      // per part (paint membership) plus a Tint button per part that has a palette.
      function buildAutotilePanel() {
        const wrap = $("autotilePanel"), tools = $("autotileTools");
        tools.innerHTML = "";
        if (!activePartList.length) { wrap.style.display = "none"; return; }
        wrap.style.display = "";
        for (const p of activePartList) {
          const b = document.createElement("button");
          b.textContent = p.label; b.title = `Auto-tile: ${p.group} ${p.id}`;
          b._part = p; b._kind = "paint";
          b.onclick = () => { clearLayer(); tool = "autotile"; activePart = p; setTool(); $("status").textContent = p.status; };
          tools.appendChild(b);
          if (p.tint) {
            const t = document.createElement("button");
            t.textContent = "✨ Tint"; t.title = "Click a plateau top to toggle its bright elevation highlight";
            t._part = p; t._kind = "tint";
            t.onclick = () => { clearLayer(); tool = "tint"; activeTintPart = p; setTool(); $("status").textContent = "Tint — click a plateau top to toggle its bright elevation highlight (click again to reset)."; };
            tools.appendChild(t);
          }
        }
      }

      // ---- Layers: enemy spawns ---------------------------------------------
      // Build the spawn working set from the server's merged view. Base spawns
      // (from spawns.yaml) carry their origin tile as baseKey so a move/delete
      // can suppress them; overlay spawns are the editor's own placements.
      function initLayers() {
        spawnList = (D.spawns || []).map((s) => ({
          type: s.type, x: s.x, y: s.y, source: s.source,
          baseKey: s.source === "base" ? key(s.x, s.y) : undefined,
        }));
        removedBaseKeys = new Set(); spawnSel = null; draggingSpawn = null; spawnsDirty = false;
        layerMode = null;
        spawnType = (D.monsterTypes && D.monsterTypes[0]?.id) || null;
        const typeSel = $("spawnType");
        typeSel.innerHTML = (D.monsterTypes || []).map((m) => `<option value="${m.id}">${m.name} (${m.id})</option>`).join("");
        typeSel.onchange = () => { spawnType = typeSel.value; };
        const mapped = D.floor != null;
        $("layerPanel").style.display = mapped ? "" : "none";
        $("layerHint").textContent = mapped ? `floor ${D.floor} · ${D.zone}` : "";
        $("spawnPanel").style.display = "none";
        setLayer(null);
      }
      function setLayer(mode) {
        layerMode = mode;
        if (mode) { tool = "paint"; sel = null; activePart = null; activeTintPart = null; }
        $("layerSpawns").classList.toggle("on", mode === "spawns");
        $("spawnPanel").style.display = mode === "spawns" ? "" : "none";
        setTool(); buildRoster(); draw();
        if (mode === "spawns") {
          $("status").textContent = `Spawns layer (floor ${D.floor}/${D.zone}) — pick a monster, click to place. Drag to move, right-click or Del to delete.`;
        }
      }
      $("layerSpawns").onclick = () => setLayer(layerMode === "spawns" ? null : "spawns");
      // Tile tools and layer editing are mutually exclusive — picking a tile tool
      // (or roster/autotile entry) drops out of the active layer so the canvas
      // paints again. Spawn edits stay in memory until saved.
      function clearLayer() {
        if (!layerMode) return;
        layerMode = null; spawnSel = null; draggingSpawn = null;
        $("layerSpawns").classList.remove("on"); $("spawnPanel").style.display = "none"; draw();
      }

      // stable hue per monster type so markers are visually distinct
      function spawnColor(type) {
        let h = 0; for (let i = 0; i < type.length; i++) h = (h * 31 + type.charCodeAt(i)) >>> 0;
        return `hsl(${h % 360}, 70%, 55%)`;
      }
      const spawnAtCell = (x, y) => { for (let i = spawnList.length - 1; i >= 0; i--) if (spawnList[i].x === x && spawnList[i].y === y) return spawnList[i]; return null; };
      function placeSpawn(x, y) {
        if (!spawnType) { $("status").textContent = "Pick a monster type first."; return; }
        const s = { type: spawnType, x, y, source: "overlay" };
        spawnList.push(s); spawnSel = s; spawnsDirty = true;
        $("status").textContent = `Placed ${spawnType} at (${x},${y}). ${spawnList.length} spawn(s) on this floor.`;
      }
      function moveSpawnTo(s, x, y) {
        if (s.x === x && s.y === y) return;
        if (s.source === "base") { removedBaseKeys.add(s.baseKey); s.source = "overlay"; s.baseKey = undefined; }
        s.x = x; s.y = y; spawnsDirty = true;
      }
      function deleteSpawn(s) {
        const i = spawnList.indexOf(s); if (i < 0) return;
        if (s.source === "base") removedBaseKeys.add(s.baseKey);
        spawnList.splice(i, 1); if (spawnSel === s) spawnSel = null; spawnsDirty = true;
        $("status").textContent = `Deleted ${s.type} at (${s.x},${s.y}).`;
      }
      function drawSpawns() {
        if (layerMode !== "spawns") return;
        const r = TS * 0.32, showLabel = cam.scale > 0.45;
        for (const s of spawnList) {
          const cx = (s.x + 0.5) * TS, cy = (s.y + 0.5) * TS;
          vctx.beginPath(); vctx.arc(cx, cy, r, 0, Math.PI * 2);
          if (s.source === "overlay") { vctx.fillStyle = spawnColor(s.type); vctx.fill(); }
          vctx.lineWidth = (s === spawnSel ? 3 : 2) / cam.scale;
          vctx.strokeStyle = s === spawnSel ? "#ffcc44" : (s.source === "overlay" ? "#0009" : spawnColor(s.type));
          vctx.stroke();
          if (showLabel) {
            vctx.fillStyle = "#fff"; vctx.strokeStyle = "#000"; vctx.lineWidth = 3 / cam.scale;
            vctx.font = `${Math.round(TS * 0.34)}px system-ui`; vctx.textAlign = "center"; vctx.textBaseline = "top";
            const t = s.type.length > 8 ? s.type.slice(0, 8) + "…" : s.type;
            vctx.strokeText(t, cx, cy + r + 1); vctx.fillText(t, cx, cy + r + 1);
          }
        }
        vctx.textAlign = "start"; vctx.textBaseline = "alphabetic";
      }

      async function saveSpawns() {
        const overlay = spawnList.filter((s) => s.source === "overlay").map((s) => ({ type: s.type, x: s.x, y: s.y }));
        const removed = [...removedBaseKeys].map((k) => { const [x, y] = k.split(",").map(Number); return { x, y }; });
        $("status").textContent = "Saving spawns + rebuilding content…";
        const res = await fetch("/editor/api/spawns/save?stage=" + encodeURIComponent(stageName), {
          method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ overlay, removed }),
        }).then((r) => r.json());
        if (res.ok) {
          spawnsDirty = false;
          $("status").textContent = `Saved ${overlay.length} editor spawn(s) (+${removed.length} suppressed) + rebuilt content. Game tab hot-reloads.`;
          return true;
        }
        $("status").textContent = "Spawn save FAILED:\n" + (res.error || res.log || "").slice(-600);
        return false;
      }

      function paintCell(x, y) {
        if (tool === "pick") { pickAt(x, y); return; }
        if (tool === "autotile") { if (activePart) paintPart(activePart, x, y); return; }
        if (tool === "erase") {
          const f = roster.find((r) => r.char === eraseChar);
          if (!f) { $("status").textContent = "No background tile to erase to."; return; }
          setCell(x, y, { char: f.char, ref: f.ref, blocked: f.blocked, rot: 0 });
          reflowAround(x, y);                          // heal adjacent plateau edges
          return;
        }
        if (!sel) { $("status").textContent = "Pick a roster tile first."; return; }
        setCell(x, y, { char: sel.char, ref: sel.ref, blocked: sel.blocked, rot: brushRot });
      }

      // ---- right-click context-menu actions (operate on cell rc) ----
      function rotateCell(rc, dir) { beginAction(); const nd = ((cellRot(rc.x, rc.y) + 90 * dir) % 360 + 360) % 360; setCell(rc.x, rc.y, { char: charAt(rc.x, rc.y), ref: displayRef(rc.x, rc.y), blocked: blockedChar(charAt(rc.x, rc.y)), rot: nd }); brushRot = nd; endAction(); draw(); }
      function copyCell(rc) { clipboard = { char: charAt(rc.x, rc.y), ref: displayRef(rc.x, rc.y), blocked: blockedChar(charAt(rc.x, rc.y)), rot: cellRot(rc.x, rc.y) }; $("status").textContent = `Copied '${clipboard.char}' (${clipboard.rot}°).`; }
      function pasteCell(rc) { if (!clipboard) return; beginAction(); setCell(rc.x, rc.y, { ...clipboard }); endAction(); draw(); }
      function eraseCell(rc) { const f = roster.find((r) => r.char === eraseChar); if (!f) return; beginAction(); setCell(rc.x, rc.y, { char: f.char, ref: f.ref, blocked: f.blocked, rot: 0 }); endAction(); draw(); }
      function fillArea(rc) {
        const t = tool === "erase" ? roster.find((r) => r.char === eraseChar) : sel;
        if (!t) { $("status").textContent = "Pick a tile first."; return; }
        const target = charAt(rc.x, rc.y); beginAction();
        const stack = [[rc.x, rc.y]], seen = new Set(); let n = 0; const CAP = 8000;
        while (stack.length && n < CAP) {
          const [x, y] = stack.pop(), k = key(x, y);
          if (seen.has(k) || x < 0 || y < 0 || x >= D.cols || y >= D.rows) continue;
          seen.add(k);
          if (charAt(x, y) !== target) continue;
          setCell(x, y, { char: t.char, ref: t.ref, blocked: t.blocked, rot: brushRot }); n++;
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        endAction(); $("status").textContent = `Filled ${n} cell(s)${n >= CAP ? " (capped)" : ""}.`; draw();
      }

      view.addEventListener("mousedown", (e) => {
        closeCtx();
        if (e.button === 1 || spaceDown) { panning = true; userMoved = true; panStart = { x: e.clientX - cam.x, y: e.clientY - cam.y }; e.preventDefault(); return; }
        if (e.button !== 0) return; // right-click handled by contextmenu
        const c = cellAt(e.clientX, e.clientY); if (!c) return;
        if (layerMode === "spawns") {
          const hit = spawnAtCell(c.x, c.y);
          if (hit) { spawnSel = hit; draggingSpawn = hit; } else { placeSpawn(c.x, c.y); }
          draw(); return;
        }
        if (tool === "tint") { tintFlood(activeTintPart, c.x, c.y); draw(); return; } // single click floods, no drag
        painting = true; beginAction(); paintCell(c.x, c.y); draw();
      });
      window.addEventListener("mousemove", (e) => {
        if (panning) { cam.x = e.clientX - panStart.x; cam.y = e.clientY - panStart.y; draw(); return; }
        const c = cellAt(e.clientX, e.clientY);
        hover = c;
        if (c) $("hud").textContent = `(${c.x}, ${c.y})  '${charAt(c.x, c.y)}'  ${blockedChar(charAt(c.x, c.y)) ? "⛔ blocked" : "✓ walkable"}  ·  rot ${cellRot(c.x, c.y)}°  ·  brush ${brushRot}°`;
        if (draggingSpawn && c) moveSpawnTo(draggingSpawn, c.x, c.y);
        else if (painting && c && layerMode !== "spawns") paintCell(c.x, c.y);
        draw();
      });
      window.addEventListener("mouseup", () => { if (painting) endAction(); painting = false; panning = false; draggingSpawn = null; });
      view.addEventListener("contextmenu", (e) => {
        e.preventDefault(); const c = cellAt(e.clientX, e.clientY); if (!c) return; hover = c;
        if (layerMode === "spawns") { const s = spawnAtCell(c.x, c.y); if (s) { deleteSpawn(s); draw(); } return; }
        openCtx(e.clientX, e.clientY, c);
      });
      view.addEventListener("wheel", (e) => {
        e.preventDefault(); userMoved = true;
        const r = view.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
        const wx = (mx - cam.x) / cam.scale, wy = (my - cam.y) / cam.scale;
        cam.scale = Math.max(0.08, Math.min(4, cam.scale * (e.deltaY < 0 ? 1.12 : 0.89)));
        cam.x = mx - wx * cam.scale; cam.y = my - wy * cam.scale; draw();
      }, { passive: false });

      let spaceDown = false;
      // Rotate the hovered tile in place (and sync the brush to it); if nothing is
      // hovered, just advance the brush rotation used for subsequent paints.
      function rotateAction() {
        if (hover) { rotateCell(hover, 1); }
        else { brushRot = (brushRot + 90) % 360; draw(); }
      }

      // ---- context menu UI ----
      function closeCtx() { $("ctx").classList.remove("show"); }
      function openCtx(px, py, rc) {
        const menu = $("ctx"); menu.innerHTML = "";
        const mk = (label, fn, disabled) => { const d = document.createElement("div"); d.className = "it" + (disabled ? " dis" : ""); d.textContent = label; if (!disabled) d.onmousedown = (ev) => { ev.preventDefault(); closeCtx(); fn(); }; menu.appendChild(d); };
        const sep = () => { const s = document.createElement("div"); s.className = "sep"; menu.appendChild(s); };
        const head = document.createElement("div"); head.className = "it dis"; head.textContent = `(${rc.x},${rc.y}) '${charAt(rc.x, rc.y)}' ${cellRot(rc.x, rc.y)}°`; menu.appendChild(head); sep();
        mk("Rotate ⟳ 90°", () => rotateCell(rc, 1));
        mk("Rotate ⟲ 90°", () => rotateCell(rc, -1));
        sep();
        mk("Copy tile", () => copyCell(rc));
        mk("Paste here", () => pasteCell(rc), !clipboard);
        mk("Pick as brush", () => pickAt(rc.x, rc.y));
        sep();
        mk("Fill matching area", () => fillArea(rc));
        mk("Erase → " + eraseChar, () => eraseCell(rc));
        menu.style.left = px + "px"; menu.style.top = py + "px"; menu.classList.add("show");
        const r = menu.getBoundingClientRect();
        if (r.right > innerWidth) menu.style.left = px - r.width + "px";
        if (r.bottom > innerHeight) menu.style.top = py - r.height + "px";
      }
      window.addEventListener("mousedown", (e) => { if (!$("ctx").contains(e.target)) closeCtx(); });
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if ((e.ctrlKey || e.metaKey) && e.code === "KeyZ") { e.preventDefault(); undo(); return; }
        if ((e.ctrlKey || e.metaKey) && e.code === "KeyC") { if (hover) { e.preventDefault(); copyCell(hover); } return; }
        if ((e.ctrlKey || e.metaKey) && e.code === "KeyV") { if (hover && clipboard) { e.preventDefault(); pasteCell(hover); } return; }
        if (e.code === "Escape") { closeCtx(); if (layerMode === "spawns") { spawnSel = null; draw(); } }
        if ((e.code === "Delete" || e.code === "Backspace") && layerMode === "spawns" && spawnSel) { e.preventDefault(); deleteSpawn(spawnSel); draw(); }
        if (e.code === "Space") { spaceDown = true; view.style.cursor = "grab"; }
        if (e.code === "KeyR") { e.preventDefault(); rotateAction(); }
      });
      window.addEventListener("keyup", (e) => { if (e.code === "Space") { spaceDown = false; view.style.cursor = "crosshair"; } });

      function setTool() {
        for (const [id, t] of [["tPaint", "paint"], ["tErase", "erase"], ["tPick", "pick"]]) $(id).classList.toggle("on", tool === t);
        for (const b of $("autotileTools").children) {
          b.classList.toggle("on", (b._kind === "paint" && tool === "autotile" && activePart === b._part)
            || (b._kind === "tint" && tool === "tint" && activeTintPart === b._part));
        }
      }
      $("tPaint").onclick = () => { clearLayer(); tool = "paint"; setTool(); };
      $("tErase").onclick = () => { clearLayer(); tool = "erase"; setTool(); };
      $("tPick").onclick = () => { clearLayer(); tool = "pick"; setTool(); };
      $("tRot").onclick = rotateAction;
      $("toggleAtlas").onclick = () => $("atlasWrap").classList.toggle("show");
      for (const id of ["optCol", "optTrees", "optGrid"]) $(id).onchange = draw;

      $("save").onclick = async () => {
        const cells = [...overrides.entries()].map(([k, v]) => { const [x, y] = k.split(",").map(Number); return { x, y, char: v.char, ref: v.ref, blocked: v.blocked, rot: v.rot || 0 }; });
        // Persist legend/vocab adds, but drop blob tiles that were never actually painted —
        // otherwise every load would bloat the stage legend with all 16 road variants.
        // (This is also why we can't gauge "has tile edits" from legendAdds alone:
        // road/water blob chars are minted on load but unused until painted.)
        const used = new Set(cells.map((c) => c.char));
        const legendAddsOut = {}, vocabAddsOut = {};
        for (const ch of Object.keys(legendAdds)) {
          if (blobChars.has(ch) && !used.has(ch)) continue;
          legendAddsOut[ch] = legendAdds[ch]; if (vocabAdds[ch]) vocabAddsOut[ch] = vocabAdds[ch];
        }
        const hasTileWork = cells.length || Object.keys(legendAddsOut).length;
        // Spawn edits (overlay file + content rebuild) and tile edits (stage import)
        // save independently. Save whatever is dirty; report a combined status.
        const done = [];
        if (spawnsDirty) { if (await saveSpawns()) done.push("spawns"); }
        if (!hasTileWork) { if (!done.length) $("status").textContent = "Nothing to save."; return; }
        $("status").textContent = "Saving + rebuilding stage…";
        const res = await fetch("/editor/api/save?stage=" + encodeURIComponent(stageName), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ cells, legendAdds: legendAddsOut, vocabAdds: vocabAddsOut }) }).then((r) => r.json());
        if (res.ok) {
          // fold saved edits into base so display stays correct, clear pending
          for (const [k, v] of overrides) { const [x, y] = k.split(",").map(Number); D.ascii[y] = D.ascii[y].slice(0, x) + v.char + D.ascii[y].slice(x + 1); D.base[y][x] = v.ref; if (D.fringe) D.fringe[y][x] = null; if (v.rot) D.rotations[k] = v.rot; else delete D.rotations[k]; }
          Object.assign(D.legend, legendAddsOut); Object.assign(D.vocab, vocabAddsOut);
          overrides.clear(); undoStack.length = 0;
          done.unshift(`${cells.length} cell(s)`);
          $("status").textContent = `Saved ${done.join(" + ")} + rebuilt. Switch to the game tab — it hot-reloads.`;
        } else {
          $("status").textContent = "Save FAILED (stage not changed in-game):\n" + (res.error || res.log || "").slice(-600);
        }
      };

      window.addEventListener("resize", resize);
      new ResizeObserver(resize).observe($("stage"));

      // Test seam: gated behind ?__test so it is inert in normal use. Exposes the few
      // internals an e2e spec needs to drive autotiling deterministically (no canvas
      // pixel math). See tests/e2e/editor-autotile.spec.ts.
      if (new URLSearchParams(location.search).has("__test")) {
        window.__ed = {
          loadStage, draw,
          parts: () => activePartList,
          paint: (part, x, y) => paintPart(part, x, y),
          charAt: (x, y) => charAt(x, y),
          stage: () => stageName,
          // Spawns layer seam: drive place/move/delete and read the working set +
          // the exact payload a save would POST, without writing files.
          setLayer, placeSpawn, deleteSpawn, moveSpawnTo,
          floor: () => D?.floor,
          spawnAt: (x, y) => spawnAtCell(x, y),
          spawns: () => spawnList.map((s) => ({ ...s })),
          spawnPayload: () => ({
            overlay: spawnList.filter((s) => s.source === "overlay").map((s) => ({ type: s.type, x: s.x, y: s.y })),
            removed: [...removedBaseKeys].map((k) => { const [x, y] = k.split(",").map(Number); return { x, y }; }),
          }),
        };
      }
      boot();
</script>
  </body>
</html>
